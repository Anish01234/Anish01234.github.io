<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kawaii Doodle</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FFC1E3, #B39DDB, #80DEEA);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1A1A2E;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    p  { font-size: 1rem; opacity: 0.75; margin: 0 0 32px; }
    a  {
      display: inline-block;
      background: #1A1A2E;
      color: #FFF;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1rem;
    }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var userId = params.get('id') || '';

      // If the app is installed, the custom scheme may open it directly.
      // We attempt it silently then fall through to the Play Store after a short delay.
      if (userId) {
        var appUri = 'com.kawaii.doodle://profile/' + encodeURIComponent(userId);
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = appUri;
        document.body.appendChild(iframe);
      }

      var playStore = 'https://play.google.com/store/apps/details?id=com.kawaii.doodle';
      setTimeout(function () {
        window.location.replace(playStore);
      }, 1800);
    })();
  </script>
</head>
<body>
  <h1>🎨 Kawaii Doodle</h1>
  <p>Opening the app&hellip;</p>
  <a href="https://play.google.com/store/apps/details?id=com.kawaii.doodle">
    Get Kawaii Doodle on Google Play
  </a>
</body>
</html>
