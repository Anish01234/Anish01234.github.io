[[redirects]]
  from = "/profile"
  to   = "/profile/index.html"
  status = 200

[[redirects]]
  from = "/profile/*"
  to   = "/profile/index.html"
  status = 200

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
